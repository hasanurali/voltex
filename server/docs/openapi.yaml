openapi: 3.1.0

info:
  title: Voltex API
  description: REST API for the Voltex social media platform
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and account management

  - name: Profile
    description: User profile management

  - name: User
    description: User management

  - name: Follow
    description: User follow management

  - name: Post
    description: Post management

  - name: Comment
    description: Comment management

  - name: Reaction
    description: Post and comment reactions

  - name: Notification
    description: Notification management

  - name: Conversation
    description: Conversation management

  - name: Message
    description: Messaging

  - name: Setting
    description: User settings

  - name: Block
    description: User blocking


paths:

  # ============================================================
  # AUTHENTICATION
  # ============================================================

  /auth/register:
    post:
      tags:
        - Authentication

      summary: Register a new user

      description: >
        Creates a new user account and profile and sends an email
        verification OTP.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:

        '201':
          description: Registration successful

        '400':
          description: Validation failed

        '409':
          description: Email or username already exists


  /auth/verify-email:
    post:
      tags:
        - Authentication

      summary: Verify email address

      description: >
        Verifies the user's email address using the OTP sent to their
        email. On successful verification, access and refresh token
        cookies are issued.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'

      responses:

        '200':
          description: Email verified successfully. Access and refresh token cookies are set.

        '400':
          description: |
            Possible messages:
            - Verification session expired. Please login again
            - Invalid OTP

        '409':
          description: Email already verified


  /auth/resend-otp:
    post:
      tags:
        - Authentication

      summary: Resend verification OTP

      description: >
        Generates a new verification OTP and sends it to the user's
        email address.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'

      responses:

        '200':
          description: OTP sent successfully

        '400':
          description: Verification session expired. Please login again

        '409':
          description: Email already verified


  /auth/login:
    post:
      tags:
        - Authentication

      summary: Login user

      description: >
        Authenticates a user using their email and password.
        Successful authentication sets access and refresh token cookies.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:

        '200':
          description: Login successful. Access and refresh token cookies are set.

        '400':
          description: Validation failed

        '401':
          description: Invalid email or password

        '403':
          description: Verify your email


  /auth/logout:
    post:
      tags:
        - Authentication

      summary: Logout user

      description: >
        Logs out the authenticated user, removes the stored refresh
        token, and clears the access and refresh token cookies.

      security:
        - accessTokenCookie: []

      responses:

        '200':
          description: Logout successful. Authentication cookies are cleared.

        '401':
          description: You are not authorized


  /auth/refresh-token:
    post:
      tags:
        - Authentication

      summary: Refresh authentication tokens

      description: >
        Validates the refresh token stored in the refreshToken cookie
        and issues a new access token and refresh token.

      security:
        - refreshTokenCookie: []

      responses:

        '200':
          description: Token refreshed successfully. New access and refresh token cookies are set.

        '401':
          description: You are not authorized


  /auth/forgot-password:
    post:
      tags:
        - Authentication

      summary: Request password reset

      description: >
        Sends a password reset link to the provided email address.
        The endpoint intentionally returns the same success response
        whether or not the email exists.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'

      responses:

        '200':
          description: Successfully sent a password reset link to email, if it exists

        '400':
          description: Validation failed


  /auth/reset-password:
    post:
      tags:
        - Authentication

      summary: Reset password

      description: >
        Resets the user's password using a valid password reset token.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'

      responses:

        '200':
          description: Password reset successfully, please login with your new password

        '400':
          description: |
            Possible messages:
            - Validation failed
            - Invalid or expired password reset link


  /auth/me:
    get:
      tags:
        - Authentication

      summary: Get current authenticated user

      description: >
        Returns the authenticated user's account and profile data.

      security:
        - accessTokenCookie: []

      responses:

        '200':
          description: User fetched successfully

        '401':
          description: You are not authorized
  

  # ============================================================
  # PROFILE
  # ============================================================

  /profile/username/check:
    get:
      tags:
        - Profile

      summary: Check username availability
      description: Checks whether a username is available.

      parameters:
        - name: username
          in: query
          required: true
          description: Username to check.
          schema:
            type: string
            minLength: 3
            maxLength: 30
            pattern: '^[a-z][a-z0-9_]*$'
          example: hasanur_ali

      responses:
        '200':
          description: Username availability result.

        '400':
          description: Validation failed.


  /profile/{username}:
    get:
      tags:
        - Profile

      summary: Get public profile
      description: >
        Returns the public user and profile information for the specified
        username. Sensitive user fields and internal image public IDs
        are not exposed.

      parameters:
        - name: username
          in: path
          required: true
          description: Public username of the user.
          schema:
            type: string
          example: hasanur_ali

      responses:
        '200':
          description: Profile fetched successfully.

        '404':
          description: Profile not found.


  /profile/username:
    patch:
      tags:
        - Profile

      summary: Update username
      description: Updates the authenticated user's username.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsernameRequest'

      responses:
        '200':
          description: Username updated successfully.

        '400':
          description: Validation failed.

        '401':
          description: You are not authorized.

        '404':
          description: Profile not found.

        '409':
          description: Username already exists.


  /profile:
    patch:
      tags:
        - Profile

      summary: Update profile
      description: >
        Updates the authenticated user's profile. Only fields provided
        in the request are updated.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

      responses:
        '200':
          description: Profile updated successfully.

        '400':
          description: Validation failed.

        '401':
          description: You are not authorized.


  /profile/avatar:
    patch:
      tags:
        - Profile

      summary: Update avatar
      description: >
        Updates the authenticated user's avatar. The image is uploaded
        client-side and the resulting URL and Cloudinary public ID are
        sent to the API.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvatarRequest'

      responses:
        '200':
          description: Avatar changed successfully.

        '400':
          description: >
            Validation failed or avatar upload failed.

        '401':
          description: You are not authorized.

        '404':
          description: Profile not found.


    delete:
      tags:
        - Profile

      summary: Remove avatar
      description: >
        Removes the authenticated user's custom avatar and restores
        the default avatar.

      security:
        - accessTokenCookie: []

      responses:
        '200':
          description: Avatar removed successfully.

        '401':
          description: You are not authorized.

        '404':
          description: Profile not found.


  /profile/cover-image:
    patch:
      tags:
        - Profile

      summary: Update cover image
      description: >
        Updates the authenticated user's cover image. The image is
        uploaded client-side and the resulting URL and Cloudinary
        public ID are sent to the API.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCoverImageRequest'

      responses:
        '200':
          description: Cover image changed successfully.

        '400':
          description: >
            Validation failed or cover image upload failed.

        '401':
          description: You are not authorized.

        '404':
          description: Profile not found.


    delete:
      tags:
        - Profile

      summary: Remove cover image
      description: >
        Removes the authenticated user's custom cover image and
        restores the default cover image.

      security:
        - accessTokenCookie: []

      responses:
        '200':
          description: Cover image removed successfully.

        '401':
          description: You are not authorized.

        '404':
          description: Profile not found.


  # ============================================================
  # USERS
  # ============================================================

  /users:
    get:
      tags:
        - User

      summary: Search users

      description: >
        Returns a paginated list of verified, active, and non-deleted users.
        Users can be searched by username or display name, with username
        matches receiving higher relevance.

      parameters:

        - in: query
          name: page
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1

        - in: query
          name: limit
          required: false
          description: Number of users per page. Maximum 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 20

        - in: query
          name: search
          required: false
          description: Search by username or display name.
          schema:
            type: string
            example: hasan

      responses:

        '200':
          description: Users fetched successfully


  # ============================================================
  # FOLLOW
  # ============================================================

  /follows/{username}:
    post:
      tags:
        - Follow

      summary: Follow a user

      description: >
        Creates a follow relationship between the authenticated user
        and the specified user.

      security:
        - accessTokenCookie: []

      parameters:
        - name: username
          in: path
          required: true
          description: Username of the user to follow
          schema:
            type: string
          example: hasanur003

      responses:

        '201':
          description: User followed successfully

        '400':
          description: User cannot follow themselves

        '401':
          description: Authentication required

        '404':
          description: User not found

        '409':
          description: User is already followed


    delete:
      tags:
        - Follow

      summary: Unfollow a user

      description: >
        Removes the follow relationship between the authenticated user
        and the specified user.

      security:
        - accessTokenCookie: []

      parameters:
        - name: username
          in: path
          required: true
          description: Username of the user to unfollow
          schema:
            type: string
          example: hasanur003

      responses:

        '200':
          description: User unfollowed successfully

        '401':
          description: Authentication required

        '404':
          description: User not found

        '409':
          description: User is not currently followed


  /follows/followers/{username}:
    get:
      tags:
        - Follow

      summary: Get user's followers

      description: >
        Retrieves the users who follow the specified user.

      parameters:
        - name: username
          in: path
          required: true
          description: Username of the user whose followers should be retrieved
          schema:
            type: string
          example: hasanur003

      responses:

        '200':
          description: Followers fetched successfully

        '404':
          description: User not found


  /follows/following/{username}:
    get:
      tags:
        - Follow

      summary: Get users followed by specified user

      description: >
        Retrieves the users that the specified user follows.

      parameters:
        - name: username
          in: path
          required: true
          description: Username of the user whose following list should be retrieved
          schema:
            type: string
          example: hasanur003

      responses:

        '200':
          description: Following users fetched successfully

        '404':
          description: User not found        


  # ============================================================
  # POST
  # ============================================================

  /posts:
    post:
      tags:
        - Post
      summary: Create Post
      description: Create a new post.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        '201':
          description: Post created successfully
        '400':
          description: Validation failed
        '401':
          description: Unauthorized

    get:
      tags:
        - Post
      summary: Fetch Home Feed
      description: >
        Fetch the personalized home feed.

        For authenticated users, the feed includes:
        - Following users posts
        - Suggested users posts
        - Popular public posts

        For guest users, only popular public posts are returned.

        Supports cursor-based pagination.
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Encoded cursor returned from the previous request.
      responses:
        '200':
          description: Posts fetched successfully


  /posts/{postId}:
    get:
      tags:
        - Post
      summary: Fetch Post Details
      description: Fetch a single post by post ID.
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details fetched successfully
        '400':
          description: Invalid post ID
        '404':
          description: Post not found

    patch:
      tags:
        - Post
      summary: Update Post
      description: Update an existing post.
      security:
        - accessTokenCookie: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        '200':
          description: Post updated successfully
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Only the post owner can perform this action
        '404':
          description: Post not found

    delete:
      tags:
        - Post
      summary: Delete Post
      description: Soft delete a post.
      security:
        - accessTokenCookie: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted successfully
        '400':
          description: Invalid post ID
        '401':
          description: Unauthorized
        '403':
          description: Only the post owner can perform this action
        '404':
          description: Post not found


  /posts/user/{username}:
    get:
      tags:
        - Post
      summary: Fetch User Posts
      description: Fetch paginated posts of a user.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string

        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50

      responses:
        '200':
          description: User posts fetched successfully
        '400':
          description: Invalid username
        '404':
          description: User not found



  # ============================================================
  # COMMENT
  # ============================================================

  /comments:
    post:
      tags:
        - Comment
      summary: Create Comment
      description: Create a new comment or reply to an existing comment.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        '201':
          description: Comment created successfully
        '400':
          description: Invalid post ID or comment ID or parent comment does not belong to this post
        '401':
          description: Unauthorized
        '404':
          description: Post or parent comment not found


  /comments/post/{postId}:
    get:
      tags:
        - Comment
      summary: Fetch Post Comments
      description: Fetch paginated comments of a post.
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string

        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50

      responses:
        '200':
          description: Comment fetched successfully
        '400':
          description: Invalid post ID
        '404':
          description: Post not found


  /comments/{commentId}/replies:
    get:
      tags:
        - Comment
      summary: Fetch Comment Replies
      description: Fetch replies of a comment.
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Comment replies fetched successfully
        '400':
          description: Invalid comment ID
        '404':
          description: Comment not found


  /comments/{commentId}:
    patch:
      tags:
        - Comment
      summary: Update Comment
      description: Update an existing comment.
      security:
        - accessTokenCookie: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        '200':
          description: Comment updated successfully
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Only the comment owner can perform this action
        '404':
          description: Comment not found

    delete:
      tags:
        - Comment
      summary: Delete Comment
      description: Soft delete a comment and its nested replies.
      security:
        - accessTokenCookie: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment deleted successfully
        '400':
          description: Invalid comment ID
        '401':
          description: Unauthorized
        '403':
          description: Only the comment owner can perform this action
        '404':
          description: Comment not found
  


  # ============================================================
  # REACTION
  # ============================================================

  /reactions:
    post:
      tags:
        - Reaction

      summary: React to a post or comment

      description: >
        Creates a reaction for the authenticated user on the specified
        post or comment.

        The target type determines whether the target ID belongs to a
        post or a comment.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReactionRequest"

      responses:

        '201':
          description: Post or comment reacted successfully

        '400':
          description: Invalid target type or target ID

        '401':
          description: Unauthorized

        '404':
          description: Post or comment not found

        '409':
          description: User has already reacted to this target


    delete:
      tags:
        - Reaction

      summary: Remove reaction from a post or comment

      description: >
        Removes the authenticated user's reaction from the specified
        post or comment.

        The target type determines whether the target ID belongs to a
        post or a comment.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteReactionRequest"

      responses:

        '200':
          description: Post or comment reaction removed successfully

        '400':
          description: Invalid target type or target ID

        '401':
          description: Unauthorized

        '404':
          description: Post or comment not found

        '409':
          description: User has not reacted to this target



  # ============================================================
  # NOTIFICATION
  # ============================================================

  /notifications:
    get:
      tags:
        - Notification

      summary: Fetch Notifications

      description: >
        Retrieves the authenticated user's notifications.

        Supports page-based pagination and returns the total number
        of notifications along with the total number of unread
        notifications.

      security:
        - accessTokenCookie: []

      parameters:

        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of notifications to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:

        '200':
          description: Notifications fetched successfully

        '401':
          description: Authentication required


  /notifications/{notificationId}/read:
    patch:
      tags:
        - Notification

      summary: Mark Notification as Read

      description: >
        Marks a specific notification as read.

        Only the owner of the notification can perform this action.
        If the notification is already read, no update is performed.

      security:
        - accessTokenCookie: []

      parameters:

        - name: notificationId
          in: path
          required: true
          description: ID of the notification to mark as read.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

      responses:

        '200':
          description: Notification marked as read successfully

        '400':
          description: Invalid notification ID

        '401':
          description: Authentication required

        '403':
          description: Only the notification owner can perform this action

        '404':
          description: Notification not found


  /notifications/read-all:
    patch:
      tags:
        - Notification

      summary: Mark All Notifications as Read

      description: >
        Marks all unread notifications belonging to the authenticated
        user as read.

      security:
        - accessTokenCookie: []

      responses:

        '200':
          description: All notifications marked as read successfully

        '401':
          description: Authentication required


  /notifications/{notificationId}:
    delete:
      tags:
        - Notification

      summary: Delete Notification

      description: >
        Deletes a notification belonging to the authenticated user.

        Only the owner of the notification can perform this action.

      security:
        - accessTokenCookie: []

      parameters:

        - name: notificationId
          in: path
          required: true
          description: ID of the notification to delete.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

      responses:

        '200':
          description: Notification deleted successfully

        '400':
          description: Invalid notification ID

        '401':
          description: Authentication required

        '403':
          description: Only the notification owner can perform this action

        '404':
          description: Notification not found



  # ============================================================
  # CONVERSATION
  # ============================================================
  
  /conversations:
    get:
      tags:
        - Conversation

      summary: Fetch User Conversations

      description: >
        Fetch conversations belonging to the authenticated user.

        Supports pagination using page and limit query parameters.

      security:
        - accessTokenCookie: []

      parameters:

        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of conversations to fetch per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:

        '200':
          description: Conversation fetched successfully

        '401':
          description: Authentication required


  /conversations/{conversationId}:
    get:
      tags:
        - Conversation

      summary: Fetch Conversation Details

      description: >
        Fetch detailed information about a specific conversation.

        The authenticated user must be a participant in the conversation.

      security:
        - accessTokenCookie: []

      parameters:

        - name: conversationId
          in: path
          required: true
          description: ID of the conversation to fetch.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

      responses:

        '200':
          description: Conversation details fetched successfully

        '400':
          description: Invalid conversation ID

        '401':
          description: Authentication required

        '404':
          description: Conversation not found 

  
  /conversations/{conversationId}/read:
    patch:
      tags:
        - Conversation

      summary: Mark All Conversation Messages as Read

      description: >
        Marks all unread messages in a conversation as read.

        Only messages sent by other participants are marked as read.

        The authenticated user must be a participant in the conversation.

      security:
        - accessTokenCookie: []

      parameters:

        - name: conversationId
          in: path
          required: true
          description: ID of the conversation whose messages should be marked as read.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

      responses:

        '200':
          description: All conversation messages marked as read successfully

        '400':
          description: Invalid conversation ID

        '401':
          description: Authentication required

        '404':
          description: Conversation not found



  # ============================================================
  # MESSAGE
  # ============================================================

  /messages:
    post:
      tags:
        - Message

      summary: Create Message

      description: >
        Creates a new message in a conversation.

        For the first message, provide a participant ID to create or reuse
        the conversation. After the conversation is created, use the returned
        conversation ID when sending subsequent messages.

        The message supports text content, image media, or video media.

      security:
        - accessTokenCookie: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'

      responses:

        '201':
          description: Message created successfully

        '400':
          description: >
            Message content or media is required, conversation or participant
            is required, or message media data is invalid.

        '401':
          description: Authentication required

        '404':
          description: User or conversation not found


  /messages/{conversationId}:
    get:
      tags:
        - Message

      summary: Fetch Conversation Messages

      description: >
        Fetch messages belonging to a specific conversation.

        The authenticated user must be a participant in the conversation.

        Supports pagination using page and limit query parameters.

        Messages are returned from oldest to newest.

      security:
        - accessTokenCookie: []

      parameters:

        - name: conversationId
          in: path
          required: true
          description: ID of the conversation whose messages should be fetched.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          description: Number of messages to fetch per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:

        '200':
          description: Messages fetched successfully

        '400':
          description: Invalid conversation ID

        '401':
          description: Authentication required

        '404':
          description: Conversation not found


  /messages/{messageId}:
    delete:
      tags:
        - Message

      summary: Delete Message

      description: >
        Soft deletes a message belonging to the authenticated user.

        Only the owner of the message can perform this action.

      security:
        - accessTokenCookie: []

      parameters:

        - name: messageId
          in: path
          required: true
          description: ID of the message to delete.
          schema:
            type: string
          example: 665f1a2b3c4d5e6f78901234

      responses:

        '200':
          description: Message deleted successfully

        '400':
          description: Invalid message ID

        '401':
          description: Authentication required

        '403':
          description: Only the message owner can perform this action

        '404':
          description: Message not found         



components:

  # ============================================================
  # SECURITY SCHEMES
  # ============================================================

  securitySchemes:

    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken

    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken


  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:

    # ============================================================
    # AUTH SCHEMAS
    # ============================================================ 

    RegisterRequest:
      type: object

      required:
        - displayName
        - username
        - email
        - password

      properties:

        displayName:
          type: string
          minLength: 2
          maxLength: 30
          description: User's display name.
          example: Hasanur Ali

        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z][a-z0-9_]*$'
          description: >
            Username must start with a lowercase letter and can contain
            lowercase letters, numbers, and underscores.
          example: hasanur_ali

        email:
          type: string
          format: email
          description: User's email address.
          example: hasanur@example.com

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: >
            Password must contain at least one uppercase letter,
            one lowercase letter, one number, and one special character
            from @$!%*?&.
          example: StrongPassword123!


    VerifyEmailRequest:
      type: object

      required:
        - email
        - otp

      properties:

        email:
          type: string
          format: email
          description: Email address used during registration.
          example: hasanur@example.com

        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: Six-digit verification OTP.
          example: '123456'


    EmailRequest:
      type: object

      required:
        - email

      properties:

        email:
          type: string
          format: email
          description: User's email address.
          example: hasanur@example.com


    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          description: User's registered email address.
          example: hasanur@example.com

        password:
          type: string
          format: password
          description: User's account password.
          example: StrongPassword123!


    ResetPasswordRequest:
      type: object

      required:
        - password
        - token

      properties:

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: >
            New password. Must contain at least one uppercase letter,
            one lowercase letter, one number, and one special character
            from @$!%*?&.
          example: NewStrongPassword123!

        token:
          type: string
          description: Password reset token.
          example: reset-token-from-email-link


    # ============================================================
    # PROFILE SCHEMAS
    # ============================================================

    UpdateUsernameRequest:
      type: object

      required:
        - username

      properties:

        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z][a-z0-9_]*$'
          description: >
            Username must start with a lowercase letter and can contain
            lowercase letters, numbers, and underscores.
          example: hasanur_ali


    UpdateProfileRequest:
      type: object

      properties:

        displayName:
          type: string
          minLength: 2
          maxLength: 30
          description: Display name containing letters and spaces.
          example: Hasanur Ali

        bio:
          type: string
          maxLength: 160
          description: User biography.
          example: MERN Stack Developer

        website:
          type: string
          format: uri
          description: User's website URL.
          example: https://example.com

        location:
          type: string
          maxLength: 100
          description: User's location.
          example: India


    UpdateAvatarRequest:
      type: object

      required:
        - url
        - publicId

      properties:

        url:
          type: string
          format: uri
          description: URL of the uploaded avatar.
          example: https://res.cloudinary.com/demo/image/upload/avatar.jpg

        publicId:
          type: string
          description: >
            Cloudinary public ID returned after avatar upload and sent by the client.
            Used by the server to manage the uploaded avatar.
          example: voltex/avatars/user123


    UpdateCoverImageRequest:
      type: object

      required:
        - url
        - publicId

      properties:

        url:
          type: string
          format: uri
          description: URL of the uploaded cover image.
          example: https://res.cloudinary.com/demo/image/upload/cover.jpg

        publicId:
          type: string
          description: >
            Cloudinary public ID returned after cover image upload and sent by the client.
            Used by the server to manage the uploaded cover image.
          example: voltex/covers/user123


    # ============================================================
    # POST SCHEMAS
    # ============================================================        

    CreatePostRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
          example: Hello Voltex

        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"

        hashtags:
          type: array
          items:
            type: string
          example:
            - react
            - nodejs

        visibility:
          type: string
          enum:
            - public
            - followers
          example: public

    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
          example: Updated post content

        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"

        hashtags:
          type: array
          items:
            type: string
          example:
            - react
            - nodejs

        visibility:
          type: string
          enum:
            - public
            - followers
          example: followers

    PostMedia:
      type: object
      required:
        - mediaType
        - url
      properties:
        mediaType:
          type: string
          enum:
            - image
            - video

        url:
          type: string
          format: uri       

        publicId:
          type: string
          description: >
             Cloudinary public ID returned after media upload and sent by the client.
             Used internally by the server to manage the uploaded media.
          example: voltex/posts/abc123xyz 


  
    # ============================================================
    # COMMENT SCHEMAS
    # ============================================================

    CreateCommentRequest:
      type: object

      required:
        - post
        - content

      properties:

        post:
          type: string
          description: ID of the post where the comment is created.
          example: 67a1b2c3d4e5f67890123456

        parentComment:
          type: string
          description: >
            ID of the parent comment when creating a reply.
            Omit this field when creating a top-level comment.
          example: 67b1c2d3e4f5a67890123456

        content:
          type: string
          maxLength: 1000
          description: Comment content.
          example: This is a great post


    UpdateCommentRequest:
      type: object

      required:
        - content

      properties:

        content:
          type: string
          maxLength: 1000
          description: Updated comment content.
          example: This is an updated comment 



    # ============================================================
    # REACTION SCHEMAS
    # ============================================================

    CreateReactionRequest:
      type: object

      required:
        - targetType
        - targetId

      properties:

        targetType:
          type: string
          enum:
            - post
            - comment
          description: Type of target to react to.
          example: post

        targetId:
          type: string
          description: ID of the post or comment to react to.
          example: 665f1a2b3c4d5e6f78901234


    DeleteReactionRequest:
      type: object

      required:
        - targetType
        - targetId

      properties:

        targetType:
          type: string
          enum:
            - post
            - comment
          description: Type of target from which the reaction should be removed.
          example: post

        targetId:
          type: string
          description: ID of the post or comment from which the reaction should be removed.
          example: 665f1a2b3c4d5e6f78901234       



    # ============================================================
    # MESSAGE SCHEMAS
    # ============================================================

    CreateMessageRequest:
      type: object

      properties:

        conversation:
          type: string
          description: ID of the existing conversation.
          example: 665f1a2b3c4d5e6f78901234

        participant:
          type: string
          description: ID of the participant when creating or reusing a conversation.
          example: 665f1a2b3c4d5e6f78905678

        content:
          type: string
          maxLength: 500
          description: Text content of the message.
          example: Hello, how are you?

        media:
          type: array
          description: Optional image or video attachments.
          items:
            type: object
            properties:

              mediaType:
                type: string
                enum:
                  - image
                  - video
                example: image

              url:
                type: string
                format: uri
                example: https://example.com/image.jpg

              publicId:
                type: string
                example: voltex/messages/image123